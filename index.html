<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14231f" />
    <title>Alien Garden</title>
  </head>
  <body>
    <main id="game-shell">
      <canvas id="canvas" aria-label="Alien Garden greenhouse"></canvas>
      <div class="stats-pill" aria-label="Garden status">
        <span class="stats-pill-icon" aria-hidden="true">&#9670;</span>
        <strong id="crystal-balance">0</strong>
        <span id="crystal-rate" class="stats-pill-rate">+0.00/s</span>
      </div>
      <p id="status" class="status-toast" role="status">Booting Chicken Fart Engine...</p>
      <button id="reset-save" class="reset-link" type="button">Reset local garden</button>
      <button id="buy-pot-button" class="buy-pot-button" type="button">
        <span class="buy-pot-icon" aria-hidden="true">&#127994;</span>
        <span id="buy-pot-cost"></span>
      </button>
      <section id="plant-popup" class="plant-popup" aria-label="Selected plant" hidden>
        <button id="plant-popup-close" class="plant-popup-close" type="button" aria-label="Close">&times;</button>
        <h2 id="plant-popup-name"></h2>
        <dl class="plant-popup-stats">
          <div>
            <dt>Level</dt>
            <dd id="plant-popup-level"></dd>
          </div>
          <div>
            <dt>Production</dt>
            <dd id="plant-popup-production"></dd>
          </div>
        </dl>
        <button id="plant-popup-move" class="plant-popup-move" type="button">Move</button>
      </section>
      <section id="buy-popup" class="plant-popup" aria-label="Buy a plant" hidden>
        <button id="buy-popup-close" class="plant-popup-close" type="button" aria-label="Close">&times;</button>
        <h2>Plant something</h2>
        <div id="buy-popup-list" class="buy-popup-list"></div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
